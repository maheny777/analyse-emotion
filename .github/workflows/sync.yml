# Optionnel : synchronise GitHub -> Space Hugging Face à chaque push sur main.
# Secret GitHub requis : HF_TOKEN (token Hugging Face avec droit Write).
# Remplacez USERNAME et NOM_DU_SPACE.
name: Sync to Hugging Face
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push vers le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          git push --force https://USERNAME:$HF_TOKEN@huggingface.co/spaces/USERNAME/NOM_DU_SPACE main
