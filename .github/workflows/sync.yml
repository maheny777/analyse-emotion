# Synchronise GitHub -> Space Hugging Face à chaque push sur main.
# Secret GitHub requis : HF_TOKEN (token Hugging Face avec droit Write).
# Variables GitHub optionnelles (Settings -> Secrets and variables -> Actions -> Variables) :
#   HF_USERNAME : nom d'utilisateur Hugging Face (défaut : mahenyjoker)
#   HF_SPACE    : nom du Space (défaut : analyse-emotion)
name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_USERNAME: ${{ vars.HF_USERNAME || 'mahenyjoker' }}
      HF_SPACE: ${{ vars.HF_SPACE || 'analyse-emotion' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push vers le Space
        env:
          HF_TOKEN: ${{ secrets.IA_ANALYSTE }}
        run: |
          git lfs install
          git push --force "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE}" main
